let phase='home',timerInterval=null,animInterval=null,currentBlob='',urlCache={},fullList=false,paused=false;
function save(){try{localStorage.setItem(KEY,JSON.stringify(data))}catch(e){}}

// While a guided session is visible, request a screen wake lock (supported in Home Screen web apps on modern iOS).
let wakeSentinel=null,wakeBusy=false,wakeUnavailable=false;
async function keepScreenOn(){
 if(!data.active||document.visibilityState!=='visible'||wakeBusy||wakeSentinel&&!wakeSentinel.released)return;
 if(!('wakeLock' in navigator)){wakeUnavailable=true;return}
 wakeBusy=true;
 try{wakeSentinel=await navigator.wakeLock.request('screen');wakeUnavailable=false;wakeSentinel.addEventListener('release',()=>{wakeSentinel=null})}
 catch(err){wakeUnavailable=true;console.warn('Screen wake lock not available:',err)}

function releaseScreen(){const current=wakeSentinel;wakeSentinel=null;if(current)current.release().catch(()=>{})}
let soundContext=null;

function ding(){
 try{unlockSound();if(!soundContext||soundContext.state!=='running')return;const now=soundContext.currentTime;
 const osc=soundContext.createOscillator(),vol=soundContext.createGain();osc.type='sine';osc.frequency.setValueAtTime(880,now);osc.frequency.exponentialRampToValueAtTime(660,now+.18);

function durationChoices(e){
 if(/3\s*[–-]\s*5\s*min/i.test(e[3]))return [180,240,300];

}

}

function mountVisual(exercise){stopAnim();const id=M[exercise[0]],frames=svgUrls(id);let box=$('visual');if(!frames.length){box.innerHTML='<div style="color:#b9cbd5;font-size:15px;text-align:center;padding:24px">Immagine temporaneamente non disponibile.<br>Controlla che l’aggiornamento sia completo.</div>';return}let note=APPROX[exercise[0]]||'';box.innerHTML='<img id="anim" alt="'+escapeHTML(exercise[1])+'">'+(note?'<div class="demoNote">'+escapeHTML(note)+'</div>':'');let n=0,sequence=[0,1,2,1];const tick=()=>{const el=$('anim');if(el)el.src=frames[sequence[n++%4]]};tick();animInterval=setInterval(tick,450)}

 const isRest=s.stage==='rest';

 '<h2 class="workouttitle">'+escapeHTML(e[1])+'</h2>'+
 '<div class="visual '+(isRest?'restVisual':'')+'" id="visual"></div>'+
 (isRest?'':'<div class="stats"><div class="stat">'+timeArea(e)+'</div></div>')+
 (e[5]&&!isRest?'<div class="weight"><button id="minus" aria-label="Riduci peso">−</button><div class="center"><strong id="weightValue">'+getWeight(e)+' kg</strong><small>PESO SALVATO · ± 1 KG</small></div><button id="plus" aria-label="Aumenta peso">+</button></div>':'')+
 '<p class="note">'+escapeHTML(isRest?'Prepara i pesi per il prossimo esercizio.':e[6])+'</p>'+
 '<button id="go" class="primary">'+(isRest?'AVANTI →':'Serie completata ✓')+'</button>'+
 '<button id="secondary" class="secondary">'+(isRest?'Metti in pausa':'Vedi tutti gli esercizi')+'</button>'+
 '<div id="listPanel" class="overview hidden"></div>';
 $('home').onclick=()=>{stopTimer();stopAnim();save();renderHome()};
 $('list').onclick=showList;
 $('go').onclick=()=>{unlockSound();keepScreenOn();advance()};
 $('secondary').onclick=isRest?togglePause:showList;
 if(!isRest){
   mountVisual(e);
   if(e[5]){$('minus').onclick=()=>adjustWeight(e,-1);$('plus').onclick=()=>adjustWeight(e,1)}
   attachTimeControls(e);
   if(data.active.timed&&data.active.timed.idx===data.active.idx&&data.active.timed.remain>0)
      timerInterval=setInterval(updateExerciseClock,250);
 }else{renderRestVisual();timerInterval=setInterval(tickRest,250)}
}
function getWeight(e){return Math.max(0,Number(data.weights[e[0]]||0))}
function adjustWeight(e,delta){data.weights[e[0]]=Math.max(0,getWeight(e)+delta);save();$('weightValue').textContent=getWeight(e)+' kg'}
function nextLabel(){
 const s=data.active,w=getWorkout(),e=current();
 let next=s.set<sets(e)?e:w.items[s.idx+1];
 if(!next)return 'Fine allenamento';
 let weight=next[5]?getWeight(next):null;
 return (next===e?'Ancora: ':'Poi: ')+next[1]+(weight!==null?' · '+weight+' kg':'');
}
function renderRestVisual(){
 const box=$('visual');
 box.innerHTML='<div class="eyebrow" style="color:var(--blue)">RESPIRA E RECUPERA</div><div class="timer" id="clock">00:00</div><div class="timerline" id="restText">Recupero in corso</div><div class="next" id="next">'+escapeHTML(nextLabel())+'</div>';
 tickRest()
}
function tickRest(){
 const s=data.active;if(!s||s.stage!=='rest')return;
 if(!s.paused)s.remain=Math.max(0,Math.ceil((s.until-Date.now())/1000));
 const clock=$('clock');if(!clock)return;
 clock.textContent=timeText(s.remain);clock.classList.toggle('flash',!s.remain);
 $('restText').textContent=s.remain?(s.paused?'Timer in pausa':'Recupero in corso'):'Recupero concluso. Premi AVANTI';
 if(s.remain===0&&!s.notified){
   s.notified=true;ding();save();stopTimer();
 }
}
function togglePause(){
 const s=data.active;if(!s||s.stage!=='rest')return;
 tickRest();if(!s.remain)return;
 s.paused=!s.paused;if(!s.paused)s.until=Date.now()+s.remain*1000;
 save();$('secondary').textContent=s.paused?'Riprendi il timer':'Metti in pausa';tickRest();
}
function advance(){
 const s=data.active,w=getWorkout(),e=current();if(!s)return;
 if(s.stage==='exercise'){
  if(s.set===sets(e)&&s.idx===w.items.length-1){finish();return}
  if(e[4]>0){
    s.stage='rest';s.remain=e[4];s.until=Date.now()+e[4]*1000;s.paused=false;s.notified=false;
    save();renderSession();return;
  }
 }else{
  tickRest();s.stage='exercise';s.paused=false;
 }
 if(s.set<sets(e))s.set++;
 else{s.idx++;s.set=1;s.timed=null}
 save();renderSession()
}
function showList(){const p=$('listPanel');const w=getWorkout(),s=data.active;let hide=!p.classList.contains('hidden');if(hide){p.classList.add('hidden');return}p.classList.remove('hidden');p.innerHTML='<h3 style="margin:10px 0">Esercizi della seduta</h3>'+w.items.map((e,i)=>'<button data-index="'+i+'"><b>'+(i+1)+'. '+escapeHTML(e[1])+(i===s.idx?' · IN CORSO':'')+'</b><small>'+sets(e)+' × '+escapeHTML(e[3])+' · recupero '+e[4]+'s</small></button>').join('')+'<div class="safety">Tocca un esercizio per raggiungerlo. Le serie non completate vengono saltate.</div>';p.querySelectorAll('[data-index]').forEach(b=>b.onclick=()=>{if(!confirm('Passare a questo esercizio?'))return;s.idx=Number(b.dataset.index);s.set=1;s.stage='exercise';save();renderSession()})}
function finish(){const w=getWorkout();stopTimer();stopAnim();releaseScreen();data.last=w.id;data.lastDate=new Date().toISOString();data.active=null;save();phase='complete';app.innerHTML='<div class="hero" style="padding-top:20vh;text-align:center"><div class="eyebrow">ALLENAMENTO COMPLETATO</div><h1 style="margin:22px 0">Seduta '+w.id+' ✓</h1><p>Ottimo lavoro. La prossima seduta sarà '+D[(D.findIndex(x=>x.id===w.id)+1)%5].id+'.</p></div><button class="primary" id="done">Torna agli allenamenti →</button>';$('done').onclick=renderHome}
window.addEventListener('pagehide',save);
document.addEventListener('visibilitychange',()=>{if(document.hidden){save();stopAnim();releaseScreen()}else if(phase==='session'){keepScreenOn();renderSession()}});
try{if(!window.ALLENATI_MOTIONS||Object.keys(window.ALLENATI_MOTIONS).length<30)throw Error('Animazioni non ancora caricate');renderHome()}catch(err){app.innerHTML='<div class="hero"><h1>Allenati</h1><p>Alcuni file dell’aggiornamento non sono ancora disponibili. Riapri l’app con Internet per completare l’installazione.</p></div><button class="primary" onclick="location.reload()">Riprova</button>';console.error(err)}
if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./service-worker.js').catch(console.warn));
</script></body></html>
